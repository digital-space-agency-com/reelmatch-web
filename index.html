    <!-- The title, description, canonical, social tags, hreflang and JSON-LD
         below are the homepage defaults. scripts/prerender.mjs rewrites them
         per route when it renders each page to static HTML. -->
    <title>ReelMatch — Movie Matching App | Find Films You Both Want To Watch</title>

    <!-- GitHub Pages SPA Script -->
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
