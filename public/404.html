<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Page Not Found | ReelMatch</title>
    <meta name="robots" content="noindex, follow" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Card tags for links that land here (e.g. older reelmatch.app/i/<handle>
         invite links). Some messengers ignore them on a 404, so the app should
         share reelmatch.app/i/?u=<handle>, which is a real page. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ReelMatch" />
    <meta property="og:title" content="ReelMatch: pick what to watch together" />
    <meta property="og:description" content="Swipe through trailers on your own phones and see the movies and shows you all said yes to. Free on iPhone and Android." />
    <meta property="og:image" content="https://reelmatch.app/images/social-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ReelMatch: pick what to watch together" />
    <meta name="twitter:image" content="https://reelmatch.app/images/social-preview.png" />
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      
      // Only redirect if this is actually a SPA route (contains hash routing patterns)
      var l = window.location;
      var shouldRedirect = l.pathname !== '/' &&
                          !l.pathname.endsWith('.html') &&
                          !l.pathname.endsWith('.xml') &&
                          !l.pathname.endsWith('.txt');
      
      if (shouldRedirect) {
        var pathSegmentsToKeep = 0;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      }
    </script>
  </head>
  <body>
    <div style="text-align: center; padding: 50px; font-family: Arial, sans-serif;">
      <h1>Page Not Found</h1>
      <p>The page you're looking for doesn't exist.</p>
      <a href="/" style="color: #007bff; text-decoration: none;">← Return to Home</a>
    </div>
  </body>
</html>
